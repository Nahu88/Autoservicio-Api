services:
  mysql_db:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    env_file:
      - ./.env.docker
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - app-network
  app:
    build: .
    container_name: autoservicio_api
    env_file:
      - ./.env.docker
    ports:
      - '4000:4000'
    depends_on:
      - mysql_db
    networks:
      - app-network
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    env_file:
      - ./.env.docker
    ports:
      - '8080:80'
    depends_on:
      - mysql_db
    networks:
      - app-network
volumes:
  mysql-data:
networks:
  app-network:
    driver: bridge